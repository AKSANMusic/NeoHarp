name: Build Plugins

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxinerama-dev libxrandr-dev \
                                  libxcursor-dev libgl1-mesa-dev libfreetype6-dev \
                                  libcurl4-gnutls-dev libasound2-dev

      - name: Configure CMake
        run: cmake -B Plugin/build -S Plugin -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build Plugin/build --config Release --parallel 4

      - name: Run Tests (Unix)
        if: runner.os != 'Windows'
        run: |
          cd Plugin/build
          ./NeoHarpTests

      - name: Run Tests (Windows)
        if: runner.os == 'Windows'
        run: |
          cd Plugin/build
          .\Release\NeoHarpTests.exe

      # Upload VST3
      - name: Upload VST3 Artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: NeoHarp-VST3-Linux
          path: Plugin/build/NeoHarp_artefacts/VST3/NeoHarp.vst3/

      - name: Upload VST3 Artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: NeoHarp-VST3-macOS
          path: Plugin/build/NeoHarp_artefacts/VST3/NeoHarp.vst3/

      - name: Upload VST3 Artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: NeoHarp-VST3-Windows
          path: Plugin/build/NeoHarp_artefacts/VST3/NeoHarp.vst3/

      # Upload Standalone
      - name: Upload Standalone Artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: NeoHarp-Standalone-Linux
          path: Plugin/build/NeoHarp_artefacts/Standalone/NeoHarp

      - name: Upload Standalone Artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: NeoHarp-Standalone-macOS
          path: Plugin/build/NeoHarp_artefacts/Standalone/NeoHarp.app/

      - name: Upload Standalone Artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: NeoHarp-Standalone-Windows
          path: Plugin/build/NeoHarp_artefacts/Standalone/NeoHarp.exe
